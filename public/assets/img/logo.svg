<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Pentagon Shield -->
  <path d="M50 4 L88 20 C88 56 68 84 50 96 C32 84 12 56 12 20 Z" fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inner Rim -->
  <path d="M50 10 L82 23 C82 53 65 77 50 88 C35 77 18 53 18 23 Z" fill="none" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Golden Wings / Rice Ears motif -->
  <path d="M28 48 C28 36 36 28 50 28 C64 28 72 36 72 48 C72 64 50 74 50 74 C50 74 28 64 28 48 Z" fill="#FFFFFF" fill-opacity="0.15"/>

  <!-- Open Book (Education) -->
  <path d="M50 56 Q62 50 72 54 L72 66 Q62 62 50 68 Q38 62 28 66 L28 54 Q38 50 50 56 Z" fill="url(#goldGrad)" stroke="#FFA000" stroke-width="1"/>
  <line x1="50" y1="56" x2="50" y2="68" stroke="#0D47A1" stroke-width="1.5"/>

  <!-- Technology Cog / Gear in Center -->
  <circle cx="50" cy="42" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="50" cy="42" r="5" fill="#E3F2FD"/>
  <path d="M50 30 L50 34 M50 50 L50 54 M38 42 L42 42 M58 42 L62 42 M41.5 33.5 L44.3 36.3 M55.7 47.7 L58.5 50.5 M41.5 50.5 L44.3 47.7 M55.7 36.3 L58.5 33.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Star at top -->
  <polygon points="50,15 52.5,21 59,21.5 54,25.5 55.8,31.5 50,28 44.2,31.5 46,25.5 41,21.5 47.5,21" fill="url(#goldGrad)"/>
</svg>
